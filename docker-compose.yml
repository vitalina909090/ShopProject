version: '3.8'

services:
  shop-search:
    image: getmeili/meilisearch:v1.6
    container_name: shop-meilisearch-container
    environment:
      - MEILI_ENV=development
      - MEILI_MASTER_KEY=${MEILI_MASTER_KEY}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    restart: always

  shop-mailpit:
    image: axllent/mailpit:latest
    container_name: shop-mailpit-container
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: always

volumes:
  meili_data: